name: Android API 24 compatibility

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/android-api24-compat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api24-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install compile SDK 37
        shell: bash
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          if [ -d "$SDK/platforms/android-37.0" ] && [ ! -e "$SDK/platforms/android-37" ]; then
            ln -s "$SDK/platforms/android-37.0" "$SDK/platforms/android-37"
          fi
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: API 24 emulator — tests, startup and DocumentsUI fallback
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 24
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -e
            echo "Device SDK: $(adb shell getprop ro.build.version.sdk)"
            test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = "24"
            ./gradlew --no-daemon :app:connectedDebugAndroidTest
            # Gradle connected tests can uninstall the target APK during cleanup.
            # Reinstall the SAME built debug APK before the separate launch smoke.
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.tranquochuy.parkpin/.MainActivity | tee api24-app-launch.txt
            grep -q 'Status: ok' api24-app-launch.txt
            sleep 2
            adb exec-out screencap -p > api24-app-home.png
            adb shell am start -W -a android.intent.action.OPEN_DOCUMENT -c android.intent.category.OPENABLE -t 'image/*' | tee api24-documents-ui-launch.txt
            grep -q 'Status: ok' api24-documents-ui-launch.txt
            adb exec-out screencap -p > api24-documents-ui.png
            python3 scripts/api24_photo_e2e.py
      - name: Upload API 24 acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api24-compatibility-evidence
          if-no-files-found: warn
          path: |
            api24-app-launch.txt
            api24-documents-ui-launch.txt
            api24-app-home.png
            api24-documents-ui.png
            api24-e2e-evidence/**
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
