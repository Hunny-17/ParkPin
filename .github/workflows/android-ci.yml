name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      # ubuntu-latest Android runner already provides cmdline-tools.
      # setup-android@v3 currently tries to install obsolete package "tools"
      # and fails before Gradle can run; invoke sdkmanager directly instead.
      - name: Install Android SDK 37
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0"
      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
